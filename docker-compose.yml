name: birthday-tracker

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-birthdays}
  POSTGRES_USER: ${POSTGRES_USER:-birthday}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birthday}

x-queue-env: &queue-env
  SUBMISSIONS_QUEUE: ${SUBMISSIONS_QUEUE:-birthday.submissions}
  REMINDERS_QUEUE: ${REMINDERS_QUEUE:-birthday.reminders}

services:
  postgres:
    image: postgres:16-alpine
    environment: *db-env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-birthday}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-birthday}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    environment:
      <<: *queue-env
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-birthday}:${POSTGRES_PASSWORD:-birthday}@postgres:5432/${POSTGRES_DB:-birthdays}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-birthday}:${RABBITMQ_PASSWORD:-birthday}@rabbitmq:5672
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  coordinator:
    build: ./coordinator
    environment:
      <<: *queue-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-birthdays}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-birthday}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-birthday}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-birthday}
      REMINDER_CRON: ${REMINDER_CRON:-0 0 6 * * *}
    ports:
      - "${COORDINATOR_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmqdata:
