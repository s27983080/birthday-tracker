spring:
  application:
    name: coordinator
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/birthdays}
    username: ${SPRING_DATASOURCE_USERNAME:birthday}
    password: ${SPRING_DATASOURCE_PASSWORD:birthday}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:birthday}
    password: ${SPRING_RABBITMQ_PASSWORD:birthday}
    listener:
      simple:
        # Retry a failing message in-process a few times (e.g. a database blip), then reject it
        # without requeueing so RabbitMQ dead-letters it to <submissions queue>.dlq instead of
        # redelivering it forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

birthday-tracker:
  queues:
    submissions: ${SUBMISSIONS_QUEUE:birthday.submissions}
    reminders: ${REMINDERS_QUEUE:birthday.reminders}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
